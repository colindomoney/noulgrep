  - id: open_redirect-low
    category: other
    source: vulnerabilities/open_redirect/help/help.php
    locations:
      - path: vulnerabilities/open_redirect/source/low.php
        lines: [3, 5]
    notes: >-
      $_GET['redirect'] goes straight into a Location header with no validation, so the page
