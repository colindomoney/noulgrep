# Ground truth for dvwa. Schema: ground_truth/README.md.
# Labelled 2026-09-20 by reading each level file against help/help.php; line numbers are for the pinned sha.
target: dvwa
sha: b496a5d3de6b967410155e1b7d3e51e9d035eb22
vulns:
  - id: api-low
    category: authz
    source: vulnerabilities/api/help/help.php
    locations:
      - path: vulnerabilities/api/src/User.php
        lines: [38, 47]
      - path: vulnerabilities/api/public/index.php
        lines: [41, 48]
    notes: >-
      Unauthenticated API version pivot: the router accepts any /v<N> prefix and User::toArray()
      case 1 serialises the sha256 password hash, so GET /vulnerabilities/api/v1/user/ leaks every
      credential. source/low.php is only the JavaScript that calls v2; the flaw is in src/.
      impossible.php is a prose page about OAuth 2.0 and contains no equivalent endpoint.
  - id: api-medium
    category: authz
    source: vulnerabilities/api/help/help.php
    locations:
      - path: vulnerabilities/api/src/UserController.php
        lines: [54, 60]
      - path: vulnerabilities/api/src/UserController.php
        lines: [221, 226]
    notes: >-
      Mass assignment / privilege escalation: validateUpdate() only requires "name" but updateUser()
      blindly copies an attacker-supplied "level" field, so a PUT with level=0 makes the user an
      admin. The server-side flaw is in src/, not in source/medium.php which is only the UI.
  - id: api-high
    category: injection
    source: vulnerabilities/api/help/help.php
    locations:
      - path: vulnerabilities/api/src/HealthController.php
        lines: [84, 88]
    notes: >-
      OS command injection: the /v2/health/connectivity endpoint concatenates the JSON "target"
      field straight into exec("ping -c 4 " . $target). Deviates from the api->authz default
      because help.php points this level at the health calls and the flaw is command injection,
      not authorisation. No escapeshellarg/allowlist anywhere; source/high.php is only prose.
  - id: authbypass-low
    category: authz
    source: vulnerabilities/authbypass/help/help.php
    locations:
      - path: vulnerabilities/authbypass/source/low.php
        lines: [1, 11]
      - path: vulnerabilities/authbypass/get_user_data.php
        lines: [10, 13]
      - path: vulnerabilities/authbypass/change_user_details.php
        lines: [11, 14]
    notes: >-
      Missing authorisation rather than a bad line, so source/low.php is given as a block range -
      the whole file is a comment and performs no role check, and both AJAX endpoints only gate
      on high/impossible. The only "protection" is that the menu entry is hidden for non-admins
      in dvwa/includes/dvwaPage.inc.php:311-313, i.e. security by obscurity.
      impossible.php mitigates with an explicit dvwaCurrentUser() != "admin" check plus 403.
  - id: authbypass-medium
    category: authz
    source: vulnerabilities/authbypass/help/help.php
    locations:
      - path: vulnerabilities/authbypass/get_user_data.php
        lines: [10, 13]
      - path: vulnerabilities/authbypass/change_user_details.php
        lines: [11, 14]
    notes: >-
      source/medium.php does gate the HTML page on admin, but the two AJAX endpoints it calls do
      not: get_user_data.php only restricts high/impossible and change_user_details.php only
      restricts impossible, so a non-admin can read and write every user directly.
  - id: authbypass-high
    category: authz
    source: vulnerabilities/authbypass/help/help.php
    locations:
      - path: vulnerabilities/authbypass/change_user_details.php
        lines: [11, 14]
      - path: vulnerabilities/authbypass/change_user_details.php
        lines: [47, 48]
    notes: >-
      get_user_data.php is now locked down for high, but change_user_details.php still only blocks
      the impossible level, so any authenticated user can UPDATE any row. Line 47 additionally
      concatenates $data->first_name/surname/id into the UPDATE, a secondary SQL injection.
      impossible.php and the endpoint's impossible branch require dvwaCurrentUser() == "admin".
  - id: bac-low
    category: authz
    source: vulnerabilities/bac/help/help.php
    locations:
      - path: vulnerabilities/bac/source/low.php
        lines: [30, 33]
      - path: vulnerabilities/bac/source/low.php
        lines: [77, 81]
    notes: >-
      IDOR: the access decision compares the requested user_id against $_COOKIE['user_id'], which
      the client fully controls, so editing the cookie grants any profile. Lines 77-81 also splice
      the X-Forwarded-For header into the bac_log INSERT (second-order SQL injection).
      impossible.php compares against a server-derived $current_user_id from a prepared statement.
  - id: bac-medium
    category: authz
    source: vulnerabilities/bac/source/medium.php
    locations:
      - path: vulnerabilities/bac/source/medium.php
        lines: [26, 29]
      - path: vulnerabilities/bac/source/medium.php
        lines: [21, 21]
    notes: >-
      The "authorisation" is a hardcoded shared secret compared with `$_GET['token'] == 'user_token'`
      and it is even disclosed in an HTML comment on line 46; it never ties the token to the caller.
      $id also reaches the queries as a quoted string, so the numeric-only preg_match at line 14 is
      the only thing holding back injection. impossible.php uses prepared statements plus an
      identity check against the session user.
  - id: bac-high
    category: authz
    source: vulnerabilities/bac/help/help.php
    locations:
      - path: vulnerabilities/bac/source/high.php
        lines: [40, 43]
      - path: vulnerabilities/bac/source/high.php
        lines: [106, 109]
    notes: >-
      Queries are parameterised here, but the access decision trusts $_SESSION['user_id'], which is
      seeded unconditionally at lines 107-108 and is therefore vulnerable to session fixation /
      pre-set session values. impossible.php re-derives the identity from dvwaCurrentUser() on every
      request and adds rate limiting.
  - id: brute-low
    category: auth
    source: vulnerabilities/brute/help/help.php
    locations:
      - path: vulnerabilities/brute/source/low.php
        lines: [3, 9]
      - path: vulnerabilities/brute/source/low.php
        lines: [12, 13]
    notes: >-
      No rate limiting, lockout, CSRF token or delay on the login handler, and credentials arrive by
      GET; passwords are hashed with bare md5 and the username is concatenated into the query
      (line 12), so the login is also SQL-injectable. impossible.php adds a prepared statement,
      a failed_login counter with a 15-minute lockout and checkToken().
  - id: brute-medium
    category: auth
    source: vulnerabilities/brute/help/help.php
    locations:
      - path: vulnerabilities/brute/source/medium.php
        lines: [3, 11]
      - path: vulnerabilities/brute/source/medium.php
        lines: [28, 28]
    notes: >-
      Only mitigation over low is a fixed `sleep(2)` on failure (line 28), which just slows a
      serial attacker and is defeated by parallel requests; there is still no lockout, no token and
      no per-account counter. Password hashing is still md5.
  - id: brute-high
    category: auth
    source: vulnerabilities/brute/source/high.php
    locations:
      - path: vulnerabilities/brute/source/high.php
        lines: [3, 5]
      - path: vulnerabilities/brute/source/high.php
        lines: [33, 33]
    notes: >-
      Adds checkToken() and a random `sleep(rand(0,3))`, but the anti-CSRF token is served in the
      login page itself so a scripted attacker simply re-reads it each round; there is still no
      account lockout and md5 password hashing. impossible.php is the level that adds the lockout.
  - id: captcha-low
    category: auth
    source: vulnerabilities/captcha/help/help.php
    locations:
      - path: vulnerabilities/captcha/source/low.php
        lines: [45, 51]
      - path: vulnerabilities/captcha/source/low.php
        lines: [60, 61]
    notes: >-
      The step-2 handler is reached whenever `step=2` is posted and never re-verifies the CAPTCHA,
      so posting step=2 directly changes the password with no CAPTCHA at all. This is a
      missing-check flaw, so the range covers the step-2 handler head rather than one bad line.
      impossible.php calls recaptcha_check_answer() on the single request and also demands the
      current password via a prepared statement.
  - id: captcha-medium
    category: auth
    source: vulnerabilities/captcha/source/medium.php
    locations:
      - path: vulnerabilities/captcha/source/medium.php
        lines: [54, 59]
      - path: vulnerabilities/captcha/source/medium.php
        lines: [67, 69]
    notes: >-
      The step-2 gate is `if( !$_POST['passed_captcha'] )` - a client-supplied boolean, so adding
      passed_captcha=true to the request bypasses the CAPTCHA entirely. Trusting a hidden form
      field as proof of a server-side check.
  - id: captcha-high
    category: auth
    source: vulnerabilities/captcha/source/high.php
    locations:
      - path: vulnerabilities/captcha/source/high.php
        lines: [17, 23]
      - path: vulnerabilities/captcha/source/high.php
        lines: [30, 31]
    notes: >-
      The CAPTCHA result is OR'd with a hardcoded backdoor: g-recaptcha-response == 'hidd3n_valu3'
      together with a spoofable User-Agent of 'reCAPTCHA' passes the check. Both halves are entirely
      attacker-controlled. impossible.php has no such escape hatch.
  - id: cryptography-low
    category: crypto
    source: vulnerabilities/cryptography/help/help.php
    locations:
      - path: vulnerabilities/cryptography/source/low.php
        lines: [16, 16]
      - path: vulnerabilities/cryptography/source/low.php
        lines: [30, 36]
    notes: >-
      Repeating-key XOR with a hardcoded key ("wachtwoord") presented as encryption; it is encoding,
      not encryption, and is trivially recovered by known-plaintext. Line 41 then compares the
      submitted password to a hardcoded literal. impossible.php replaces the whole scheme with
      AES-256-GCM (authenticated encryption) in token_library_impossible.php.
  - id: cryptography-medium
    category: crypto
    source: vulnerabilities/cryptography/source/medium.php
    locations:
      - path: vulnerabilities/cryptography/source/medium.php
        lines: [3, 3]
      - path: vulnerabilities/cryptography/source/medium.php
        lines: [25, 32]
    notes: >-
      AES-128-ECB with a hardcoded key (line 10): identical plaintext blocks map to identical
      ciphertext blocks, so the session tokens can be cut-and-pasted block-wise to forge a valid
      admin token, and there is no MAC over the ciphertext. The authorisation decision on line 32
      trusts the decrypted JSON. impossible.php uses aes-256-gcm, which authenticates the ciphertext.
  - id: cryptography-high
    category: crypto
    source: vulnerabilities/cryptography/source/token_library_high.php
    locations:
      - path: vulnerabilities/cryptography/source/token_library_high.php
        lines: [92, 93]
      - path: vulnerabilities/cryptography/source/token_library_high.php
        lines: [101, 105]
    notes: >-
      AES-128-CBC with a hardcoded key and an unauthenticated, attacker-supplied IV: check_token()
      takes the IV out of the submitted JSON and decrypts with it, so flipping bits in the IV
      rewrites the first plaintext block ("userid:2" -> "userid:1") and yields the admin account.
      source/high.php itself has no server-side sink; the logic lives in token_library_high.php,
      reached via check_token_high.php. token_library_impossible.php switches to aes-256-gcm and
      verifies the GCM tag before trusting the plaintext.
  - id: csp-low
    category: config
    source: vulnerabilities/csp/help/help.php
    locations:
      - path: vulnerabilities/csp/source/low.php
        lines: [3, 5]
      - path: vulnerabilities/csp/source/low.php
        lines: [13, 17]
    notes: >-
      Two-part config flaw: the script-src allowlist includes public user-content CDNs
      (unpkg.com, cdn.jsdelivr.net, pastebin.com ...) where anyone can host arbitrary JS, and
      line 15 drops $_POST['include'] straight into a <script src> with no validation.
      impossible.php narrows the policy to script-src 'self' and serves a fixed callback.
  - id: csp-medium
    category: config
    source: vulnerabilities/csp/source/medium.php
    locations:
      - path: vulnerabilities/csp/source/medium.php
        lines: [3, 3]
      - path: vulnerabilities/csp/source/medium.php
        lines: [14, 18]
    notes: >-
      The policy pairs a nonce with 'unsafe-inline', which defeats the nonce for browsers that
      honour unsafe-inline, and the nonce itself is a hardcoded constant baked into the source, so
      an attacker can simply include nonce="TmV2ZXIgZ29pbmcgdG8gZ2l2ZSB5b3UgdXA=". Line 16 reflects
      $_POST['include'] unescaped into the page body.
  - id: csp-high
    category: config
    source: vulnerabilities/csp/help/help.php
    locations:
      - path: vulnerabilities/csp/source/jsonp.php
        lines: [4, 12]
      - path: vulnerabilities/csp/source/high.php
        lines: [8, 12]
    notes: >-
      The header is a tight script-src 'self', but the same-origin JSONP endpoint echoes the
      attacker-chosen ?callback= value into its JavaScript response (line 12), so arbitrary code is
      served from 'self' and the policy is bypassed. jsonp_impossible.php fixes this by hardcoding
      the callback name ("solveSum") and taking no input at all.
  - id: csrf-low
    category: other
    source: vulnerabilities/csrf/help/help.php
    locations:
      - path: vulnerabilities/csrf/source/low.php
        lines: [3, 6]
      - path: vulnerabilities/csrf/source/low.php
        lines: [16, 17]
    notes: >-
      A state-changing password reset performed on a plain GET with no anti-CSRF token, no
      re-authentication and no current-password check, so any cross-origin image or link changes the
      victim's password. impossible.php adds checkToken() and verifies password_current with a
      prepared statement before updating.
  - id: csrf-medium
    category: other
    source: vulnerabilities/csrf/source/medium.php
    locations:
      - path: vulnerabilities/csrf/source/medium.php
        lines: [5, 5]
      - path: vulnerabilities/csrf/source/medium.php
        lines: [18, 19]
    notes: >-
      The only defence is `stripos($_SERVER['HTTP_REFERER'], $_SERVER['SERVER_NAME'])`, a substring
      match on an attacker-influenceable header - hosting the exploit at
      http://evil.com/127.0.0.1/csrf.html satisfies it. Referer is also absent or stripped in many
      contexts, which the code never handles.
  - id: csrf-high
    category: other
    source: vulnerabilities/csrf/source/high.php
    locations:
      - path: vulnerabilities/csrf/source/high.php
        lines: [31, 39]
      - path: vulnerabilities/csrf/source/high.php
        lines: [43, 44]
    notes: >-
      checkToken() is present, but the handler still changes the password without ever verifying the
      current one, so the token is the single point of failure and any XSS elsewhere in DVWA (or the
      JSON branch at lines 7-18, which accepts the token from a request header) completes the
      attack. Block range because the weakness is the missing re-authentication across the handler.
      impossible.php adds the password_current check.
  - id: exec-low
    category: injection
    source: vulnerabilities/exec/help/help.php
    locations:
