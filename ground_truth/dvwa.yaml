    category: path
    source: vulnerabilities/upload/source/high.php
    locations:
      - path: vulnerabilities/upload/source/high.php
        lines: [6, 6]
      - path: vulnerabilities/upload/source/high.php
        lines: [15, 20]
    notes: >-
      Checks the extension against jpg/jpeg/png and calls getimagesize(), but getimagesize() only
      inspects the header, so a valid image prefixed to PHP code (or a double extension such as
      shell.php.jpg combined with the fi module) still yields execution. The file keeps its
      user-supplied name and is never re-encoded, unlike impossible.php.
  - id: weak_id-low
    category: auth
    source: vulnerabilities/weak_id/help/help.php
    locations:
      - path: vulnerabilities/weak_id/source/low.php
        lines: [6, 11]
    notes: >-
      The dvwaSession cookie is a simple incrementing integer, so any user's session id can be
      guessed by counting. The cookie is also set with no expiry, path, Secure or HttpOnly flags.
      impossible.php uses bin2hex(random_bytes(20)) with Secure and HttpOnly set.
  - id: weak_id-medium
    category: auth
    source: vulnerabilities/weak_id/source/medium.php
    locations:
      - path: vulnerabilities/weak_id/source/medium.php
        lines: [6, 7]
    notes: >-
      The session value is time(), a low-entropy, publicly observable value, so an attacker who
      knows roughly when a victim logged in can brute force a few thousand candidates. Still no
      cookie flags.
  - id: weak_id-high
    category: auth
    source: vulnerabilities/weak_id/source/high.php
    locations:
      - path: vulnerabilities/weak_id/source/high.php
        lines: [6, 11]
    notes: >-
      md5() of the same incrementing counter: hashing a predictable input does not add entropy, so
      the id space is enumerable by hashing 1, 2, 3 ... Note the extra cookie attributes at line 11
      set secure and httponly to false. impossible.php seeds from a CSPRNG and sets both to true.
  - id: xss_d-low
    category: xss
    source: vulnerabilities/xss_d/help/help.php
    locations:
      - path: vulnerabilities/xss_d/index.php
        lines: [51, 53]
      - path: vulnerabilities/xss_d/source/low.php
        lines: [1, 5]
    notes: >-
      DOM XSS: the page slices the "default=" value out of document.location.href and passes it to
      document.write() with decodeURI(), so the payload never reaches the server. source/low.php is
      a three-word comment ("No protections, anything goes") and has no server-side sink, so the
      real location is the inline script in the module's index.php. The impossible level's
      mitigation is to drop the decodeURI() call (index.php:36-38).
  - id: xss_d-medium
    category: xss
    source: vulnerabilities/xss_d/source/medium.php
    locations:
      - path: vulnerabilities/xss_d/source/medium.php
        lines: [4, 11]
      - path: vulnerabilities/xss_d/index.php
        lines: [51, 53]
    notes: >-
      Server-side stripos() for "<script" only, and it inspects $_GET, which cannot see anything
      after a "#" fragment; payloads such as "</option></select><img src=x onerror=alert(1)>" or a
      fragment-delivered payload sail past to the same document.write() sink.
  - id: xss_d-high
    category: xss
    source: vulnerabilities/xss_d/source/high.php
    locations:
      - path: vulnerabilities/xss_d/source/high.php
        lines: [4, 17]
      - path: vulnerabilities/xss_d/index.php
        lines: [51, 53]
    notes: >-
      A server-side switch allowlists four languages, but the JavaScript still reads the raw
      location.href, so a payload placed after a "#" fragment is never sent to PHP and reaches
      document.write() unfiltered. Block range because the flaw is the allowlist's blind spot
      rather than one bad statement.
  - id: xss_r-low
    category: xss
    source: vulnerabilities/xss_r/help/help.php
    locations:
      - path: vulnerabilities/xss_r/source/low.php
        lines: [6, 8]
      - path: vulnerabilities/xss_r/source/low.php
        lines: [3, 3]
    notes: >-
      $_GET['name'] is concatenated into the HTML response with no encoding, and line 3 explicitly
      sends X-XSS-Protection: 0 to disable the browser auditor. impossible.php applies
      htmlspecialchars() and drops the X-XSS-Protection header.
  - id: xss_r-medium
    category: xss
    source: vulnerabilities/xss_r/source/medium.php
    locations:
      - path: vulnerabilities/xss_r/source/medium.php
        lines: [8, 11]
    notes: >-
      Single, case-sensitive str_replace() of the literal "<script>", so "<SCRIPT>",
      "<scr<script>ipt>" (the removal reassembles the tag) or any non-script vector such as
      "<img src=x onerror=...>" is unaffected. Denylisting instead of output encoding.
  - id: xss_r-high
    category: xss
    source: vulnerabilities/xss_r/source/high.php
    locations:
      - path: vulnerabilities/xss_r/source/high.php
        lines: [8, 11]
    notes: >-
      A case-insensitive regex kills any "<s...c...r...i...p...t" sequence, but it targets only the
      script tag; "<img src=x onerror=alert(1)>", "<svg onload=...>" and friends still reflect
      unencoded. htmlspecialchars() in impossible.php is the correct fix.
  - id: xss_s-low
    category: xss
    source: vulnerabilities/xss_s/help/help.php
    locations:
      - path: vulnerabilities/xss_s/source/low.php
        lines: [5, 13]
      - path: vulnerabilities/xss_s/source/low.php
        lines: [16, 17]
    notes: >-
      Both name and message are only SQL-escaped before being stored; no HTML encoding is applied on
      the way in and the guestbook is later rendered unencoded (dvwa/includes/dvwaPage.inc.php:626),
      so the stored payload fires for every visitor. impossible.php adds htmlspecialchars() to both
      fields and switches the INSERT to a PDO prepared statement.
  - id: xss_s-medium
    category: xss
    source: vulnerabilities/xss_s/source/medium.php
    locations:
      - path: vulnerabilities/xss_s/source/medium.php
        lines: [14, 15]
      - path: vulnerabilities/xss_s/source/medium.php
        lines: [18, 19]
    notes: >-
      The message field is properly encoded (line 11) but the name field gets only a case-sensitive
      str_replace() of "<script>", so "<SCRIPT>" or an event-handler payload is stored raw and
      rendered as HTML. The maxlength on the form is client-side only.
  - id: xss_s-high
    category: xss
    source: vulnerabilities/xss_s/source/high.php
    locations:
      - path: vulnerabilities/xss_s/source/high.php
        lines: [14, 15]
      - path: vulnerabilities/xss_s/source/high.php
        lines: [18, 19]
    notes: >-
      Message is htmlspecialchars()-encoded, but the name field is filtered by the same
      script-tag-only regex used in xss_r-high, so "<img src=x onerror=alert(1)>" is stored and
      later echoed unencoded into the guestbook.
controls:
  - id: api-impossible
    path: vulnerabilities/api/source/impossible.php
    lines: [1, 22]
    notes: "prose-only page describing OAuth 2.0 token handling; no request-handling code and no sink"
  - id: authbypass-impossible
    path: vulnerabilities/authbypass/source/impossible.php
    lines: [1, 13]
    notes: "explicit dvwaCurrentUser() != 'admin' check with a 403 and exit, and the same check is enforced in both AJAX endpoints"
  - id: bac-impossible
    path: vulnerabilities/bac/source/impossible.php
    lines: [1, 292]
    notes: "prepared statements throughout, identity taken from dvwaCurrentUser() rather than a cookie, htmlspecialchars() on output, plus rate limiting and audit logging"
  - id: brute-impossible
    path: vulnerabilities/brute/source/impossible.php
    lines: [1, 102]
    notes: "PDO prepared statements, anti-CSRF checkToken(), a three-strike failed_login counter with a 15-minute lockout and a randomised failure delay"
  - id: captcha-impossible
    path: vulnerabilities/captcha/source/impossible.php
    lines: [1, 67]
    notes: "single-step flow that calls recaptcha_check_answer() on the request that changes the password, plus checkToken() and a current-password check via a prepared statement"
  - id: cryptography-impossible
    path: vulnerabilities/cryptography/source/impossible.php
    lines: [1, 70]
    notes: "delegates to token_library_impossible.php, which uses aes-256-gcm authenticated encryption and verifies the GCM tag before trusting the token"
  - id: csp-impossible
    path: vulnerabilities/csp/source/impossible.php
    lines: [1, 23]
    notes: "script-src 'self' with no inline or third-party sources, and the JSONP endpoint hardcodes its callback name instead of reflecting one"
  - id: csrf-impossible
    path: vulnerabilities/csrf/source/impossible.php
    lines: [1, 50]
    notes: "checkToken() against the session token plus mandatory verification of password_current through a PDO prepared statement"
  - id: exec-impossible
    path: vulnerabilities/exec/source/impossible.php
    lines: [1, 41]
    notes: "allowlist validation - explode on '.' and require four is_numeric() octets - before the target is rebuilt and passed to shell_exec(), plus checkToken()"
  - id: fi-impossible
    path: vulnerabilities/fi/source/impossible.php
    lines: [1, 20]
    notes: "in_array() allowlist of four exact filenames; anything else prints an error and exits before the include"
  - id: javascript-impossible
    path: vulnerabilities/javascript/source/impossible.php
    lines: [1, 1]
    notes: "file is empty (0 bytes) - DVWA deliberately ships no impossible level here because client-supplied values can never be trusted; index.php renders an explanatory message instead"
  - id: open_redirect-impossible
    path: vulnerabilities/open_redirect/source/impossible.php
    lines: [1, 29]
    notes: "is_numeric() plus a switch that maps an integer id to one of three hardcoded targets; no user input ever reaches the Location header"
  - id: sqli-impossible
    path: vulnerabilities/sqli/source/impossible.php
    lines: [1, 65]
    notes: "is_numeric()/intval() validation then PDO prepare/bindParam (PDO::PARAM_INT) or SQLite3 prepare/bindValue, plus checkToken()"
  - id: sqli_blind-impossible
    path: vulnerabilities/sqli_blind/source/impossible.php
    lines: [1, 65]
    notes: "is_numeric()/intval() validation then prepared statements with bound integer parameters, plus checkToken()"
  - id: upload-impossible
    path: vulnerabilities/upload/source/impossible.php
    lines: [1, 65]
    notes: "extension and MIME allowlist plus getimagesize(), re-encodes the image through GD to strip payloads, and renames it to bin2hex(random_bytes(16))"
  - id: weak_id-impossible
    path: vulnerabilities/weak_id/source/impossible.php
    lines: [1, 9]
    notes: "session value from bin2hex(random_bytes(20)) - a CSPRNG - with an expiry, a scoped path and the Secure and HttpOnly flags set"
  - id: xss_d-impossible
    path: vulnerabilities/xss_d/source/impossible.php
    lines: [1, 5]
    notes: "no server-side code by design; the mitigation is that index.php omits the decodeURI() call for this level so the value is inserted literally"
  - id: xss_r-impossible
    path: vulnerabilities/xss_r/source/impossible.php
    lines: [1, 18]
    notes: "htmlspecialchars() on the reflected value, checkToken() on the request, and the X-XSS-Protection: 0 header is not sent"
  - id: xss_s-impossible
    path: vulnerabilities/xss_s/source/impossible.php
    lines: [1, 31]
    notes: "htmlspecialchars() on both name and message before storage and a PDO prepared statement for the INSERT, plus checkToken()"
